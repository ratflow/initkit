# initkit lazygit config - catppuccin macchiato pastel theme, no icons
gui:
  showRandomTip: false
  border: rounded
  theme:
    activeBorderColor:
      - "#c6a0f6" # mauve
    searchingActiveBorderColor:
      - "#8aadf4" # blue
    inactiveBorderColor:
      - "#6e738d" # overlay0
    optionsTextColor:
      - "#8aadf4" # blue
    selectedLineBgColor:
      - "#363a4f" # surface0
    selectedRangeBgColor:
      - "#494d64" # surface1
    cherryPickedCommitBgColor:
      - "#494d64" # surface1
    cherryPickedCommitFgColor:
      - "#a6da95" # green
    unstagedChangesColor:
      - "#ed8796" # red
    defaultFgColor:
      - "#cad3f5" # text
